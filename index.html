<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件變更對比工具</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsdiff/7.0.0/diff.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.11.0/mammoth.browser.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/opencc-js@1.0.5/dist/umd/full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        .box-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
            color: #34495e;
        }
        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 5px;
        }
        .label-row label {
            margin-bottom: 0;
        }
        .upload-btn {
            background-color: #95a5a6;
            color: white;
            border: none;
            padding: 6px 14px;
            font-size: 13px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
        }
        .upload-btn:hover {
            background-color: #7f8c8d;
        }
        /* label 右邊嘅按鈕組（複製 + 上載檔案） */
        .label-btn-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .copy-btn {
            background-color: #16a085;
            color: white;
            border: none;
            padding: 6px 14px;
            font-size: 13px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
            white-space: nowrap;
        }
        .copy-btn:hover {
            background-color: #138d75;
        }
        .copy-btn.copied {
            background-color: #27ae60;
        }
        .paste-btn {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 6px 14px;
            font-size: 13px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
            white-space: nowrap;
        }
        .paste-btn:hover {
            background-color: #ca6f1e;
        }
        .paste-btn.pasted {
            background-color: #27ae60;
        }
        .file-name {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 4px;
            min-height: 15px;
            word-break: break-all;
        }
        textarea {
            width: 100%;
            height: 250px;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            resize: vertical;
            font-size: 14px;
            line-height: 1.5;
            box-sizing: border-box;
        }
        .btn-container {
            text-align: center;
            margin-bottom: 20px;
        }
        button#compareBtn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: bold;
        }
        button#compareBtn:hover {
            background-color: #2980b9;
        }

        /* 簡繁轉換按鈕 */
        .convert-btn-container {
            text-align: center;
            margin-bottom: 15px;
        }
        button.convert-btn {
            background-color: #27ae60;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.3s;
            font-weight: bold;
            margin: 0 8px;
        }
        button.convert-btn:hover {
            background-color: #229954;
        }
        button.convert-btn.t2s {
            background-color: #8e44ad;
        }
        button.convert-btn.t2s:hover {
            background-color: #7d3c98;
        }
        #boxC {
            display: none; /* 預設隱藏，撳對比後先顯示 */
            background-color: #fff;
            padding: 20px 20px 20px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
            min-height: 200px;
            font-size: 15px;
            line-height: 1.8;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            counter-reset: line;
        }

        /* 每一行：左邊行號 + 右邊內容 */
        .line {
            display: flex;
            min-height: 1.8em;
        }
        .line::before {
            counter-increment: line;
            content: counter(line);
            flex: 0 0 3em;
            text-align: right;
            padding-right: 10px;
            margin-right: 12px;
            color: #95a5a6;
            font-size: 12px;
            line-height: 2.2; /* 對齊返 15px 內文 */
            font-family: Consolas, Menlo, monospace;
            border-right: 1px solid #e8e8e8;
            user-select: none;
        }
        .line-content {
            flex: 1;
            min-width: 0;
            white-space: pre-wrap; /* 保留空格同換行符號 */
            word-break: break-word;
        }

        /* Drag & Drop 提示效果 */
        textarea.drag-over {
            border: 2px dashed #3498db;
            background-color: #eaf4fc;
        }

        /* 代表被刪除/新增嘅換行符號嘅標記 */
        .newline-marker {
            opacity: 0.55;
            font-size: 12px;
        }

        /* Tracked Changes 的樣式設計 */
        .diff-added {
            background-color: #e6ffed;
            color: #22863a;
            text-decoration: underline;
            cursor: pointer;
            padding: 2px;
            border-radius: 3px;
            transition: background-color 0.2s;
        }
        .diff-removed {
            background-color: #ffeef0;
            color: #cb2431;
            text-decoration: line-through;
            cursor: pointer;
            padding: 2px;
            border-radius: 3px;
            transition: background-color 0.2s;
        }
        .diff-added:hover::after {
            content: " (點擊接受新增)";
            font-size: 12px;
            color: gray;
            text-decoration: none;
        }
        .diff-removed:hover::after {
            content: " (點擊接受刪除)";
            font-size: 12px;
            color: gray;
            text-decoration: none;
        }

        /* 目前跳轉到嘅 change 高亮效果 */
        .diff-current {
            outline: 3px solid #f39c12;
            outline-offset: 1px;
            box-shadow: 0 0 8px rgba(243, 156, 18, 0.6);
        }

        /* 跳轉狀態列 */
        #navStatus {
            display: none;
            position: sticky;
            top: 10px;
            z-index: 10;
            text-align: center;
            margin-bottom: 10px;
        }
        #navStatus span {
            display: inline-block;
            background-color: #2c3e50;
            color: #fff;
            font-size: 13px;
            padding: 6px 16px;
            border-radius: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* 匯出按鈕 */
        #boxCHeader {
            display: none; /* 撳對比後先顯示 */
            flex-wrap: wrap;
            gap: 8px;
        }
        .export-btn {
            color: white;
            border: none;
            padding: 6px 14px;
            font-size: 13px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: background-color 0.3s;
            white-space: nowrap;
        }
        .export-btn.html { background-color: #e67e22; }
        .export-btn.html:hover { background-color: #ca6f1e; }
        .export-btn.pdf { background-color: #c0392b; }
        .export-btn.pdf:hover { background-color: #a93226; }
        .export-btn.docx { background-color: #2980b9; }
        .export-btn.docx:hover { background-color: #216694; }

        #instruction {
            font-size: 13px;
            color: #7f8c8d;
            margin-top: 5px;
            display: none;
            text-align: center;
        }
    </style>
</head>
<body>

    <h1>文件變更對比工具</h1>

    <div class="convert-btn-container">
        <button type="button" class="convert-btn s2t" onclick="convertS2T()">簡 ➔ 繁（Text Box A → B）</button>
        <button type="button" class="convert-btn t2s" onclick="convertT2S()">繁 ➔ 簡（Text Box A → B）</button>
    </div>

    <div class="container">
        <div class="box-wrapper">
            <div class="label-row">
                <label for="boxA">Text Box A (Original 原文):</label>
                <div class="label-btn-group">
                    <button type="button" class="paste-btn" onclick="pasteIntoBox('boxA', this)">📥 貼上</button>
                    <button type="button" class="copy-btn" onclick="copyBoxText('boxA', this)">📋 複製</button>
                    <button type="button" class="upload-btn" onclick="document.getElementById('fileA').click()">📂 上載檔案</button>
                </div>
            </div>
            <input type="file" id="fileA" style="display: none;" onchange="loadFileIntoBox(this, 'boxA', 'fileNameA')">
            <textarea id="boxA" placeholder="請在此貼上原文，或者撳「上載檔案」揀純文字檔（.txt / .py / .html 等）或 Word 檔（.doc / .docx）..."></textarea>
            <div class="file-name" id="fileNameA"></div>
        </div>
        <div class="box-wrapper">
            <div class="label-row">
                <label for="boxB">Text Box B (Revised 修改版):</label>
                <div class="label-btn-group">
                    <button type="button" class="paste-btn" onclick="pasteIntoBox('boxB', this)">📥 貼上</button>
                    <button type="button" class="copy-btn" onclick="copyBoxText('boxB', this)">📋 複製</button>
                    <button type="button" class="upload-btn" onclick="document.getElementById('fileB').click()">📂 上載檔案</button>
                </div>
            </div>
            <input type="file" id="fileB" style="display: none;" onchange="loadFileIntoBox(this, 'boxB', 'fileNameB')">
            <textarea id="boxB" placeholder="請在此貼上修改後的文件，或者撳「上載檔案」揀一個純文字檔..."></textarea>
            <div class="file-name" id="fileNameB"></div>
        </div>
    </div>

    <div class="btn-container">
        <button id="compareBtn" onclick="performComparison()">比較</button>
        <p id="instruction">提示：在下方的 Text Box C 中，<strong>點擊</strong>綠色底線文字以接受新增，<strong>點擊</strong>紅色刪除線文字以接受刪除。<br>
        用 <strong>鍵盤 ← / →</strong> 或者喺手機上 <strong>左右 swipe</strong>，可以跳去上一個 / 下一個 change。</p>
    </div>

    <div id="navStatus"><span id="navStatusText"></span></div>

    <div class="label-row" id="boxCHeader">
        <label for="boxC" id="labelC">Text Box C (對比結果 - 可點擊以 Accept Changes):</label>
        <div class="label-btn-group">
            <button type="button" class="export-btn html" onclick="exportAsHtml()">🌐 匯出 HTML</button>
            <button type="button" class="export-btn pdf" onclick="exportAsPdf()">📄 匯出 PDF</button>
            <button type="button" class="export-btn docx" onclick="exportAsDocx()">📝 匯出 DOCX</button>
        </div>
    </div>
    <div id="boxC"></div>

    <script>
        /* ===== 貼上功能：一撳就將剪貼簿嘅文字貼入對應嘅 text box ===== */
        function pasteIntoBox(boxId, btn) {
            const ta = document.getElementById(boxId);
            const fileNameEl = document.getElementById(boxId === 'boxA' ? 'fileNameA' : 'fileNameB');

            // 貼上成功後喺個掣度顯示提示，1.5 秒後還原
            const showDone = () => {
                if (!btn) return;
                if (btn.dataset.origLabel === undefined) {
                    btn.dataset.origLabel = btn.textContent;
                }
                btn.textContent = '✔ 已貼上';
                btn.classList.add('pasted');
                clearTimeout(btn._pasteTimer);
                btn._pasteTimer = setTimeout(() => {
                    btn.textContent = btn.dataset.origLabel;
                    btn.classList.remove('pasted');
                }, 1500);
            };

            const applyText = (text) => {
                if (!text) {
                    alert('剪貼簿入面冇文字，冇嘢可以貼上。');
                    return;
                }
                if (ta.value && !confirm('呢個 Text Box 已經有內容，貼上會覆蓋晒佢。要繼續？')) {
                    return;
                }
                ta.value = text;
                if (fileNameEl) fileNameEl.textContent = '';
                ta.scrollTop = 0;
                showDone();
            };

            // 手動貼上（後備）：喺 file:// 或者瀏覽器唔畀讀剪貼簿嗰陣用
            const manualPaste = () => {
                alert('瀏覽器唔畀直接讀取剪貼簿。\n撳「確定」之後，個 Text Box 會自動 focus，請直接撳 Ctrl + V（Mac 用 ⌘ + V）貼上。');
                ta.focus();
                ta.select();
            };

            if (navigator.clipboard && navigator.clipboard.readText && window.isSecureContext) {
                navigator.clipboard.readText().then(applyText).catch(manualPaste);
            } else {
                manualPaste();
            }
        }

        /* ===== 複製功能：一撳就將成個 text box 嘅文字複製去剪貼簿 ===== */
        function copyBoxText(boxId, btn) {
            const ta = document.getElementById(boxId);
            const text = ta.value;
            if (!text) {
                alert('呢個 Text Box 冇內容，冇嘢可以複製。');
                return;
            }

            // 複製成功後喺個掣度顯示提示，1.5 秒後還原
            const showDone = () => {
                if (!btn) return;
                if (btn.dataset.origLabel === undefined) {
                    btn.dataset.origLabel = btn.textContent;
                }
                btn.textContent = '✔ 已複製';
                btn.classList.add('copied');
                clearTimeout(btn._copyTimer);
                btn._copyTimer = setTimeout(() => {
                    btn.textContent = btn.dataset.origLabel;
                    btn.classList.remove('copied');
                }, 1500);
            };

            // 舊方法（execCommand）：喺 file:// 或者舊瀏覽器都用得
            const fallbackCopy = () => {
                const start = ta.selectionStart;
                const end = ta.selectionEnd;
                const scrollTop = ta.scrollTop;
                ta.focus();
                ta.select();
                let ok = false;
                try { ok = document.execCommand('copy'); } catch (err) { ok = false; }
                // 還原返原本嘅游標位置同捲動位置
                ta.setSelectionRange(start, end);
                ta.scrollTop = scrollTop;
                if (ok) {
                    showDone();
                } else {
                    alert('自動複製失敗，請直接用 Ctrl + C（Mac 用 ⌘ + C）複製。');
                }
            };

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(text).then(showDone).catch(fallbackCopy);
            } else {
                fallbackCopy();
            }
        }

        /* ===== 檔案上載功能（支援純文字檔 + .doc + .docx，撳掣或者 drag & drop 都得）===== */
        function loadFileIntoBox(inputElement, boxId, fileNameId) {
            const file = inputElement.files[0];
            if (!file) return;
            processFile(file, boxId, fileNameId);
            // 清空 input value，令到揀返同一個檔案都會再觸發 onchange
            inputElement.value = '';
        }

        function processFile(file, boxId, fileNameId) {
            const reader = new FileReader();
            reader.onload = async function(e) {
                const arrayBuffer = e.target.result;
                const bytes = new Uint8Array(arrayBuffer);
                let text = null;

                try {
                    if (bytes.length >= 8 &&
                        bytes[0] === 0xD0 && bytes[1] === 0xCF && bytes[2] === 0x11 && bytes[3] === 0xE0) {
                        // Word 97-2003 (.doc)：用內置解析器抽純文字
                        text = extractDocText(arrayBuffer);
                    } else if (bytes.length >= 4 && bytes[0] === 0x50 && bytes[1] === 0x4B &&
                               /\.docx$/i.test(file.name)) {
                        // Word 2007+ (.docx)：用 mammoth 抽純文字
                        const result = await mammoth.extractRawText({ arrayBuffer: arrayBuffer });
                        text = result.value;
                    } else {
                        // 其他：當純文字檔處理
                        text = new TextDecoder('utf-8').decode(arrayBuffer);
                        // 簡單檢查係唔係純文字檔（binary 檔通常會有大量 null 字元）
                        if (text.indexOf('\u0000') !== -1) {
                            alert('呢個檔案似乎唔係純文字檔（亦唔係 .doc / .docx），請揀一個用 Notepad 開得到嘅檔案，或者 Word 檔。');
                            return;
                        }
                    }
                } catch (err) {
                    console.error(err);
                    alert('解析呢個 Word 檔時發生錯誤。可以試吓用 Word 開佢，另存新檔做 .docx 再上載。');
                    return;
                }

                document.getElementById(boxId).value = text;
                document.getElementById(fileNameId).textContent = '已載入：' + file.name;
            };
            reader.onerror = function() {
                alert('讀取檔案時發生錯誤，請再試一次。');
            };
            reader.readAsArrayBuffer(file);
        }

        // ---- Drag & Drop：直接由檔案總管拖個檔案落 Text Box A / B ----
        function setupDragDrop(boxId, fileNameId) {
            const ta = document.getElementById(boxId);
            ['dragenter', 'dragover'].forEach(evName => {
                ta.addEventListener(evName, function(e) {
                    e.preventDefault();
                    e.stopPropagation();
                    ta.classList.add('drag-over');
                });
            });
            ta.addEventListener('dragleave', function(e) {
                e.preventDefault();
                ta.classList.remove('drag-over');
            });
            ta.addEventListener('drop', function(e) {
                e.preventDefault();
                e.stopPropagation();
                ta.classList.remove('drag-over');
                const file = e.dataTransfer.files && e.dataTransfer.files[0];
                if (file) processFile(file, boxId, fileNameId);
            });
        }
        setupDragDrop('boxA', 'fileNameA');
        setupDragDrop('boxB', 'fileNameB');

        /* ===== 內置 .doc (Word 97-2003) 純文字抽取器 =====
           只用 ArrayBuffer / DataView，唔使 server，全部喺瀏覽器入面做 */
        function extractDocText(arrayBuffer) {
            const bytes = new Uint8Array(arrayBuffer);
            const dv = new DataView(arrayBuffer);

            // ---- 讀 CFB (Compound File) header ----
            const sectorSize = 1 << dv.getUint16(0x1E, true);
            const miniSectorSize = 1 << dv.getUint16(0x20, true);
            const numFatSectors = dv.getUint32(0x2C, true);
            const dirStart = dv.getUint32(0x30, true);
            const miniStreamCutoff = dv.getUint32(0x38, true);
            const miniFatStart = dv.getUint32(0x3C, true);
            const difatStart = dv.getUint32(0x44, true);
            const numDifatSectors = dv.getUint32(0x48, true);
            const sectorOffset = (sid) => 512 + sid * sectorSize;

            // ---- 砌 FAT ----
            const fatSectorIds = [];
            for (let i = 0; i < 109 && fatSectorIds.length < numFatSectors; i++) {
                const sid = dv.getUint32(0x4C + i * 4, true);
                if (sid !== 0xFFFFFFFF) fatSectorIds.push(sid);
            }
            let difatSid = difatStart;
            for (let d = 0; d < numDifatSectors && difatSid < 0xFFFFFFFE; d++) {
                const base = sectorOffset(difatSid);
                const perSector = sectorSize / 4 - 1;
                for (let i = 0; i < perSector && fatSectorIds.length < numFatSectors; i++) {
                    const sid = dv.getUint32(base + i * 4, true);
                    if (sid !== 0xFFFFFFFF) fatSectorIds.push(sid);
                }
                difatSid = dv.getUint32(base + perSector * 4, true);
            }
            const fat = [];
            for (const sid of fatSectorIds) {
                const base = sectorOffset(sid);
                for (let i = 0; i < sectorSize / 4; i++) fat.push(dv.getUint32(base + i * 4, true));
            }

            function readChain(startSid, size) {
                const out = new Uint8Array(size);
                let sid = startSid, written = 0;
                while (sid < 0xFFFFFFFE && written < size) {
                    const take = Math.min(sectorSize, size - written);
                    out.set(bytes.subarray(sectorOffset(sid), sectorOffset(sid) + take), written);
                    written += take;
                    sid = fat[sid];
                    if (sid === undefined) break;
                }
                return out;
            }

            // ---- 讀 directory ----
            let dirSize = 0, s = dirStart;
            const seen = new Set();
            while (s < 0xFFFFFFFE && !seen.has(s)) {
                seen.add(s); dirSize += sectorSize; s = fat[s];
                if (s === undefined) break;
            }
            const dirBytes = readChain(dirStart, dirSize);
            const dirDv = new DataView(dirBytes.buffer);
            const entries = {};
            let rootEntry = null;
            for (let off = 0; off + 128 <= dirBytes.length; off += 128) {
                const nameLen = dirDv.getUint16(off + 0x40, true);
                const type = dirBytes[off + 0x42];
                if (type === 0 || nameLen < 2) continue;
                let name = '';
                for (let i = 0; i < nameLen / 2 - 1; i++) name += String.fromCharCode(dirDv.getUint16(off + i * 2, true));
                const entry = { start: dirDv.getUint32(off + 0x74, true), size: dirDv.getUint32(off + 0x78, true) };
                if (type === 5) rootEntry = entry;
                entries[name] = entry;
            }

            // ---- Mini FAT / mini stream ----
            let miniFat = [], miniStream = null;
            if (rootEntry && miniFatStart < 0xFFFFFFFE) {
                let mfSize = 0; s = miniFatStart;
                const seen2 = new Set();
                while (s < 0xFFFFFFFE && !seen2.has(s)) {
                    seen2.add(s); mfSize += sectorSize; s = fat[s];
                    if (s === undefined) break;
                }
                const mfBytes = readChain(miniFatStart, mfSize);
                const mfDv = new DataView(mfBytes.buffer);
                for (let i = 0; i < mfBytes.length / 4; i++) miniFat.push(mfDv.getUint32(i * 4, true));
                miniStream = readChain(rootEntry.start, rootEntry.size);
            }

            function readStream(entry) {
                if (entry.size >= miniStreamCutoff || !miniStream) return readChain(entry.start, entry.size);
                const out = new Uint8Array(entry.size);
                let sid = entry.start, written = 0;
                while (sid < 0xFFFFFFFE && written < entry.size) {
                    const take = Math.min(miniSectorSize, entry.size - written);
                    out.set(miniStream.subarray(sid * miniSectorSize, sid * miniSectorSize + take), written);
                    written += take;
                    sid = miniFat[sid];
                    if (sid === undefined) break;
                }
                return out;
            }

            const wordEntry = entries['WordDocument'];
            if (!wordEntry) throw new Error('唔係有效嘅 Word 檔');
            const wd = readStream(wordEntry);
            const wdDv = new DataView(wd.buffer, wd.byteOffset, wd.byteLength);

            // ---- FIB：搵 piece table 位置 ----
            if (wdDv.getUint16(0, true) !== 0xA5EC) throw new Error('唔係有效嘅 Word 檔');
            const whichTable = (wdDv.getUint16(0x000A, true) & 0x0200) ? '1Table' : '0Table';
            const ccpText = wdDv.getUint32(0x004C, true);
            const fcClx = wdDv.getUint32(0x01A2, true);
            const lcbClx = wdDv.getUint32(0x01A6, true);

            const tableEntry = entries[whichTable] || entries['1Table'] || entries['0Table'];
            if (!tableEntry) throw new Error('搵唔到 table stream');
            const table = readStream(tableEntry);
            const tblDv = new DataView(table.buffer, table.byteOffset, table.byteLength);

            // ---- 喺 Clx 搵 Pcdt (piece table) ----
            let pos = fcClx;
            const clxEnd = fcClx + lcbClx;
            let plcPcdStart = -1, plcPcdLen = 0;
            while (pos < clxEnd) {
                const clxt = table[pos];
                if (clxt === 0x01) {
                    pos += 3 + tblDv.getInt16(pos + 1, true);
                } else if (clxt === 0x02) {
                    plcPcdLen = tblDv.getUint32(pos + 1, true);
                    plcPcdStart = pos + 5;
                    break;
                } else break;
            }
            if (plcPcdStart < 0) throw new Error('搵唔到文字內容');

            // ---- 逐個 piece 解碼 ----
            const n = Math.floor((plcPcdLen - 4) / 12);
            const cps = [];
            for (let i = 0; i <= n; i++) cps.push(tblDv.getUint32(plcPcdStart + i * 4, true));

            let text = '';
            for (let i = 0; i < n; i++) {
                const pcdOff = plcPcdStart + (n + 1) * 4 + i * 8;
                const fcRaw = tblDv.getUint32(pcdOff + 2, true);
                const cpLen = cps[i + 1] - cps[i];
                if (fcRaw & 0x40000000) {
                    // 壓縮：CP1252（每字元 1 byte）
                    const start = (fcRaw & 0x3FFFFFFF) >>> 1;
                    for (let j = 0; j < cpLen; j++) text += cp1252Char(wd[start + j]);
                } else {
                    // UTF-16LE（每字元 2 bytes）
                    const start = fcRaw & 0x3FFFFFFF;
                    for (let j = 0; j < cpLen; j++) text += String.fromCharCode(wdDv.getUint16(start + j * 2, true));
                }
            }

            // 只保留主文件內文，再清理 Word 特殊字元
            text = text.substring(0, ccpText)
                .replace(/\x13[^\x14\x15]*\x14?/g, '')   // field codes：只留結果
                .replace(/[\x15\x08\x01\x02\x05\x06]/g, '')
                .replace(/\x07/g, '\t')                  // 表格 cell 分隔
                .replace(/\r/g, '\n')                    // 段落標記
                .replace(/[\x0B\x0C\x0E]/g, '\n')        // 手動換行/分頁
                .replace(/[\x00\x03\x04\x0F-\x1F]/g, '');
            return text;
        }

        // CP1252 同 Latin-1 唔同嘅 0x80-0x9F 範圍
        const CP1252_HIGH = {
            0x80:'\u20AC',0x82:'\u201A',0x83:'\u0192',0x84:'\u201E',0x85:'\u2026',0x86:'\u2020',
            0x87:'\u2021',0x88:'\u02C6',0x89:'\u2030',0x8A:'\u0160',0x8B:'\u2039',0x8C:'\u0152',
            0x8E:'\u017D',0x91:'\u2018',0x92:'\u2019',0x93:'\u201C',0x94:'\u201D',0x95:'\u2022',
            0x96:'\u2013',0x97:'\u2014',0x98:'\u02DC',0x99:'\u2122',0x9A:'\u0161',0x9B:'\u203A',
            0x9C:'\u0153',0x9E:'\u017E',0x9F:'\u0178'
        };
        function cp1252Char(b) {
            if (b >= 0x80 && b <= 0x9F) return CP1252_HIGH[b] || '';
            return String.fromCharCode(b);
        }

        /* ===== 簡繁轉換功能（使用 opencc-js）===== */
        let s2tConverter = null; // 簡 ➔ 繁（香港繁體）
        let t2sConverter = null; // 繁 ➔ 簡

        /* ---- 簡轉繁後處理：修正 OpenCC 一對多映射嘅常見錯誤 ----
           問題根源：簡體「钟」同時對應繁體「鐘」（時鐘/時間）同「鍾」（鍾意/姓氏），
           OpenCC 嘅預設詞庫未必涵蓋粵語口語（例如「半個鐘」），所以需要後處理。
           策略：先將所有「鍾」當做「鐘」（因為時間用法遠比感情/姓氏常見），
                 再還原特定嘅「鍾」詞彙。 */
        function postCorrectS2T(text) {
            return text
                // === 鐘 / 鍾 一對多修正 ===
                .replace(/鍾/g, '鐘')                    // 先全部當做「鐘」
                .replace(/鐘意/g, '鍾意')                 // 還原：鍾意（喜歡）
                .replace(/鐘情/g, '鍾情')                 // 還原：鍾情
                .replace(/鐘愛/g, '鍾愛')                 // 還原：鍾愛
                .replace(/一見鐘情/g, '一見鍾情')          // 還原：一見鍾情
                .replace(/情有獨鐘/g, '情有獨鍾')          // 還原：情有獨鍾
                .replace(/鐘靈毓秀/g, '鍾靈毓秀');         // 還原：鍾靈毓秀（成語）
        }

        function convertS2T() {
            const textA = document.getElementById('boxA').value;
            if (!textA) {
                alert('Text Box A 沒有內容，請先輸入文字！');
                return;
            }
            // 懶加載：第一次撳掣先建立 converter
            if (!s2tConverter) {
                // 用 hk（香港繁體）而唔係 t（通用繁體）：
                //   hk 會用香港標準字體（為、眾、裡），唔會出異體字（爲、衆）
                //   hk 唔會做地區性詞彙替換（用户唔會變使用者，嗰個係 tw/twp 先有）
                s2tConverter = OpenCC.Converter({ from: 'cn', to: 'hk' });
            }
            // cn → hk（香港繁體）：用香港標準字符 + 詞組級別一對多消歧
            // 非中文字符（英文、標點符號等）會原封不動保留
            // 之後再做後處理修正剩餘嘅一對多問題
            document.getElementById('boxB').value = postCorrectS2T(s2tConverter(textA));
        }

        function convertT2S() {
            const textA = document.getElementById('boxA').value;
            if (!textA) {
                alert('Text Box A 沒有內容，請先輸入文字！');
                return;
            }
            if (!t2sConverter) {
                t2sConverter = OpenCC.Converter({ from: 't', to: 'cn' });
            }
            // 繁轉簡冇一對多問題（多個繁體字都映射返同一個簡體字），唔需要後處理
            document.getElementById('boxB').value = t2sConverter(textA);
        }

        /* ===== 比較功能 ===== */
        let currentChangeIndex = -1; // 目前跳轉到嘅 change（-1 = 未開始）

        function performComparison() {
            const textA = document.getElementById('boxA').value;
            const textB = document.getElementById('boxB').value;
            const boxC = document.getElementById('boxC');
            const boxCHeader = document.getElementById('boxCHeader');
            const instruction = document.getElementById('instruction');

            if (!textA && !textB) {
                alert("請先輸入文字進行對比！");
                return;
            }

            // 使用 jsdiff 進行字詞級別的對比 (diffWords)
            const diff = Diff.diffWords(textA, textB);

            // 建立逐行結構嚟顯示 Tracked Changes（每行左邊有行號）
            // 一個 change 如果跨行，會斬開做幾個 fragment，但共用同一個 data-cid，
            // 撳其中一忽就會成個 change 一齊 accept
            let cid = 0;
            const lines = [];
            let cur = { mergeUp: null, html: '' };
            const escapeHtml = (t) => t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

            diff.forEach((part) => {
                const cls = part.added ? 'diff-added' : (part.removed ? 'diff-removed' : null);
                const action = part.added ? 'add' : 'remove';
                const myCid = cls ? cid++ : null;
                const segs = part.value.split('\n');

                segs.forEach((seg, i) => {
                    if (i > 0) {
                        // 呢個換行符號本身係 change 嘅一部分
                        if (cls === 'diff-removed') {
                            // 被刪除嘅換行：加個 ¶ 標記俾人撳，下一行標記住「接受刪除後要合併返上一行」
                            cur.html += `<span class="${cls}" data-cid="${myCid}" onclick="acceptChange(this, 'remove')"><span class="newline-marker">¶</span></span>`;
                            lines.push(cur);
                            cur = { mergeUp: myCid, html: '' };
                        } else if (cls === 'diff-added') {
                            // 新增嘅換行：加個 ¶ 標記（accept 時淨係移除個標記，保留換行）
                            cur.html += `<span class="${cls}" data-cid="${myCid}" data-marker="1" onclick="acceptChange(this, 'add')"><span class="newline-marker">¶</span></span>`;
                            lines.push(cur);
                            cur = { mergeUp: null, html: '' };
                        } else {
                            lines.push(cur);
                            cur = { mergeUp: null, html: '' };
                        }
                    }
                    if (seg.length > 0) {
                        const safe = escapeHtml(seg);
                        if (cls) {
                            cur.html += `<span class="${cls}" data-cid="${myCid}" onclick="acceptChange(this, '${action}')">${safe}</span>`;
                        } else {
                            cur.html += safe;
                        }
                    }
                });
            });
            lines.push(cur);

            let displayHtml = '';
            lines.forEach((line) => {
                const mergeAttr = line.mergeUp !== null ? ` data-merge-up="${line.mergeUp}"` : '';
                displayHtml += `<div class="line"${mergeAttr}><span class="line-content">${line.html}</span></div>`;
            });

            boxC.innerHTML = displayHtml;
            boxC.style.display = 'block';
            boxCHeader.style.display = 'flex';
            instruction.style.display = 'block';

            // 重設跳轉狀態
            currentChangeIndex = -1;
            updateNavStatus();
        }

        // Accept Changes 的核心邏輯（成個 change group 一齊處理）
        function acceptChange(element, action) {
            const cidValue = element.getAttribute('data-cid');
            const group = Array.from(document.querySelectorAll(`#boxC [data-cid="${cidValue}"]`));

            // 如果接受咗嘅係目前高亮嗰個，或者係佢之前嘅 change，要調整 index
            const changes = getChangeList();
            const removedIndex = changes.findIndex(g => g.cid === cidValue);
            if (removedIndex !== -1 && removedIndex <= currentChangeIndex) {
                currentChangeIndex--;
            }

            if (action === 'add') {
                group.forEach((el) => {
                    if (el.hasAttribute('data-marker')) {
                        // 換行標記 ¶：純顯示用，accept 時直接移除（換行本身由行結構保留）
                        el.remove();
                    } else {
                        // 接受新增：移除 span 標籤，保留裡面的文字
                        const textNode = document.createTextNode(el.textContent);
                        el.parentNode.replaceChild(textNode, el);
                    }
                });
            } else if (action === 'remove') {
                // 接受刪除：將所有 fragment 從畫面上移除
                group.forEach((el) => el.remove());
                // 如果刪除嘅內容包括換行符號，將受影響嘅行合併返上一行（行號會自動更新）
                document.querySelectorAll(`#boxC .line[data-merge-up="${cidValue}"]`).forEach((line) => {
                    const prev = line.previousElementSibling;
                    if (prev && prev.classList.contains('line')) {
                        const prevContent = prev.querySelector('.line-content');
                        const content = line.querySelector('.line-content');
                        while (content.firstChild) prevContent.appendChild(content.firstChild);
                        line.remove();
                    } else {
                        line.removeAttribute('data-merge-up');
                    }
                });
            }

            updateNavStatus();
        }

        /* ==========================================================
           匯出功能：HTML（可點擊 accept）/ PDF / DOCX（Word Track Changes）
           全部都係根據 Box C 「目前」嘅狀態嚟做，
           即係你喺畫面上已經 accept 咗嘅 change，唔會再出現喺匯出檔入面。
           ========================================================== */

        const EXPORT_AUTHOR = '文件變更對比工具';

        function isResultReady() {
            const boxC = document.getElementById('boxC');
            if (!boxC || boxC.style.display !== 'block') {
                alert('請先撳「比較」產生對比結果，之後先可以匯出。');
                return false;
            }
            return true;
        }

        function exportTimestamp() {
            const d = new Date();
            const p = (n) => String(n).padStart(2, '0');
            return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes());
        }

        function nowText() {
            const d = new Date();
            const p = (n) => String(n).padStart(2, '0');
            return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
        }

        // 觸發瀏覽器下載（即係 Save As 落 local drive）
        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            }, 1000);
        }

        // 取一份乾淨嘅 Box C 副本：去咗 onclick 同高亮，但保留 data-cid / data-marker / data-merge-up
        function getCleanResultClone() {
            const clone = document.getElementById('boxC').cloneNode(true);
            clone.querySelectorAll('.diff-current').forEach((el) => el.classList.remove('diff-current'));
            clone.querySelectorAll('[onclick]').forEach((el) => el.removeAttribute('onclick'));
            return clone;
        }

        /* ---------- 1) 匯出 HTML（保留點擊 accept changes 功能） ---------- */

        const EXPORT_HTML_SCRIPT = `
(function () {
    var root = document.getElementById('diffRoot');
    var originalHtml = root.innerHTML;
    var statusText = document.getElementById('statusText');

    function countChanges() {
        var spans = root.querySelectorAll('.diff-added, .diff-removed');
        var seen = {};
        var n = 0;
        for (var i = 0; i < spans.length; i++) {
            var c = spans[i].getAttribute('data-cid');
            if (!seen[c]) { seen[c] = 1; n++; }
        }
        return n;
    }

    function updateStatus() {
        var n = countChanges();
        statusText.textContent = (n === 0) ? '✔ 冇（剩餘嘅）changes' : ('剩餘 ' + n + ' 個 changes');
    }

    // 同原本工具一模一樣嘅 accept 邏輯（成個 change group 一齊處理）
    function acceptElement(el) {
        var isAdd = el.className.indexOf('diff-added') !== -1;
        var cid = el.getAttribute('data-cid');
        var group = root.querySelectorAll('[data-cid="' + cid + '"]');
        var i;

        if (isAdd) {
            for (i = 0; i < group.length; i++) {
                var node = group[i];
                if (node.hasAttribute('data-marker')) {
                    node.parentNode.removeChild(node);
                } else {
                    node.parentNode.replaceChild(document.createTextNode(node.textContent), node);
                }
            }
        } else {
            for (i = 0; i < group.length; i++) {
                group[i].parentNode.removeChild(group[i]);
            }
            var merged = root.querySelectorAll('.line[data-merge-up="' + cid + '"]');
            for (i = 0; i < merged.length; i++) {
                var line = merged[i];
                var prev = line.previousElementSibling;
                if (prev && prev.className.indexOf('line') !== -1) {
                    var prevContent = prev.querySelector('.line-content');
                    var content = line.querySelector('.line-content');
                    while (content.firstChild) { prevContent.appendChild(content.firstChild); }
                    line.parentNode.removeChild(line);
                } else {
                    line.removeAttribute('data-merge-up');
                }
            }
        }
        updateStatus();
    }

    root.addEventListener('click', function (e) {
        var t = e.target;
        while (t && t !== root) {
            if (t.className && typeof t.className === 'string' &&
                (t.className.indexOf('diff-added') !== -1 || t.className.indexOf('diff-removed') !== -1)) {
                acceptElement(t);
                return;
            }
            t = t.parentNode;
        }
    });

    document.getElementById('btnAcceptAll').addEventListener('click', function () {
        var guard = 0;
        var el = root.querySelector('.diff-added, .diff-removed');
        while (el && guard++ < 200000) {
            acceptElement(el);
            el = root.querySelector('.diff-added, .diff-removed');
        }
    });

    document.getElementById('btnReset').addEventListener('click', function () {
        root.innerHTML = originalHtml;
        updateStatus();
    });

    document.getElementById('btnPrint').addEventListener('click', function () {
        window.print();
    });

    updateStatus();
})();
`;

        /* ---------- 2) 匯出 PDF（開一個列印視窗，喺目的地揀「另存為 PDF」） ---------- */

        function printCss() {
            return [
                '@page { size: A4; margin: 15mm; }',
                '* { -webkit-print-color-adjust: exact; print-color-adjust: exact; }',
                'body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Microsoft JhengHei", sans-serif; color: #333; margin: 0; padding: 24px; background: #fff; }',
                'h1 { font-size: 20px; color: #2c3e50; text-align: center; margin: 0 0 4px; }',
                '.meta { text-align: center; color: #7f8c8d; font-size: 12px; margin-bottom: 10px; }',
                '.legend { text-align: center; font-size: 12px; color: #555; margin-bottom: 18px; }',
                '.legend .s-add { background-color: #e6ffed; color: #22863a; text-decoration: underline; padding: 1px 4px; border-radius: 3px; }',
                '.legend .s-del { background-color: #ffeef0; color: #cb2431; text-decoration: line-through; padding: 1px 4px; border-radius: 3px; }',
                '.notice { background: #fff8e1; border: 1px solid #f0c36d; color: #7a5c00; font-size: 13px; padding: 10px 14px; border-radius: 6px; margin-bottom: 18px; line-height: 1.6; }',
                '.notice button { background: #c0392b; color: #fff; border: none; padding: 6px 14px; border-radius: 5px; font-size: 13px; font-weight: bold; cursor: pointer; margin-left: 6px; }',
                '.diff-body { font-size: 14px; line-height: 1.8; }',
                '.line { display: flex; page-break-inside: avoid; break-inside: avoid; }',
                '.line-no { flex: 0 0 3em; text-align: right; padding-right: 10px; margin-right: 12px; color: #95a5a6; font-size: 11px; line-height: 2.3; font-family: Consolas, Menlo, monospace; border-right: 1px solid #e8e8e8; }',
                '.line-content { flex: 1; min-width: 0; white-space: pre-wrap; word-break: break-word; }',
                '.newline-marker { opacity: 0.55; font-size: 11px; }',
                '.diff-added { background-color: #e6ffed; color: #22863a; text-decoration: underline; padding: 1px 2px; border-radius: 3px; }',
                '.diff-removed { background-color: #ffeef0; color: #cb2431; text-decoration: line-through; padding: 1px 2px; border-radius: 3px; }',
                '@media print { .no-print { display: none !important; } body { padding: 0; } }'
            ].join('\n');
        }

        function exportAsPdf() {
            if (!isResultReady()) return;

            // 行號改用真文字（唔靠 CSS counter），確保列印引擎一定畫得出
            const clone = getCleanResultClone();
            clone.querySelectorAll('.line').forEach((line, i) => {
                const no = document.createElement('span');
                no.className = 'line-no';
                no.textContent = String(i + 1);
                line.insertBefore(no, line.firstChild);
            });

            const doc = '<!DOCTYPE html>\n' +
                '<html lang="zh-HK">\n<head>\n' +
                '<meta charset="UTF-8">\n' +
                '<title>對比結果_' + exportTimestamp() + '</title>\n' +
                '<style>\n' + printCss() + '\n</style>\n' +
                '</head>\n<body>\n' +
                '<div class="notice no-print">📄 <strong>存做 PDF 嘅方法：</strong>喺跟住彈出嘅列印視窗，將「目的地 / Destination」揀做 <strong>「另存為 PDF / Save as PDF」</strong>，再撳「儲存」就會存落你個 local drive。<br>' +
                '（建議喺「更多設定」開啟「背景圖形 / Background graphics」，咁樣新增同刪除嘅底色先會印得出。）' +
                '<button type="button" onclick="window.print()">再次列印</button></div>\n' +
                '<h1>文件變更對比結果</h1>\n' +
                '<div class="meta">匯出時間：' + nowText() + '</div>\n' +
                '<div class="legend"><span class="s-add">新增</span>　<span class="s-del">刪除</span>　（¶ = 段落換行嘅變更）</div>\n' +
                '<div class="diff-body">' + clone.innerHTML + '</div>\n' +
                '<script>window.onload = function () { setTimeout(function () { window.print(); }, 400); };<\/script>\n' +
                '</body>\n</html>';

            const win = window.open('', '_blank');
            if (!win) {
                alert('瀏覽器阻止咗彈出視窗。請喺網址列右邊允許本頁彈出視窗，然後再撳一次「匯出 PDF」。');
                return;
            }
            win.document.open();
            win.document.write(doc);
            win.document.close();
        }

        /* ---------- 3) 匯出 DOCX（真正嘅 Word Track Changes） ---------- */

        // 將 Box C 目前嘅狀態拆返做「一行行 + 每行嘅片段」
        // paraMark: 'ins' = 呢一行嘅段落標記係新增；'del' = 段落標記被刪除（accept 之後會同下一行合併）
        function collectDiffLines() {
            const result = [];
            document.querySelectorAll('#boxC .line').forEach((lineEl) => {
                const content = lineEl.querySelector('.line-content');
                const segs = [];
                let paraMark = null;
                if (content) {
                    Array.prototype.forEach.call(content.childNodes, (node) => {
                        if (node.nodeType === 3) { // 文字節點
                            if (node.nodeValue) {
                                segs.push({ type: 'eq', text: node.nodeValue });
                                paraMark = null;
                            }
                            return;
                        }
                        if (node.nodeType !== 1) return;
                        const isAdded = node.classList.contains('diff-added');
                        const isRemoved = node.classList.contains('diff-removed');
                        // ¶ 標記：代表段落標記本身嘅變更，唔可以當普通文字
                        if (node.querySelector && node.querySelector('.newline-marker')) {
                            paraMark = isAdded ? 'ins' : (isRemoved ? 'del' : null);
                            return;
                        }
                        const text = node.textContent;
                        if (!text) return;
                        segs.push({ type: isAdded ? 'ins' : (isRemoved ? 'del' : 'eq'), text: text });
                        paraMark = null;
                    });
                }
                result.push({ segs: segs, paraMark: paraMark });
            });
            return result;
        }

        function xmlEscape(s) {
            return String(s)
                .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;');
        }

        // 一個 run；被刪除嘅文字要用 <w:delText>
        function docxRun(text, kind) {
            const tag = (kind === 'del') ? 'w:delText' : 'w:t';
            const parts = String(text).split('\t');
            let inner = '';
            parts.forEach((p, i) => {
                if (i > 0) inner += '<w:tab/>';
                if (p) inner += '<' + tag + ' xml:space="preserve">' + xmlEscape(p) + '</' + tag + '>';
            });
            return inner ? '<w:r>' + inner + '</w:r>' : '';
        }

        function buildDocumentXml(lines) {
            let id = 1;
            const stamp = new Date().toISOString().replace(/\.\d{3}Z$/, 'Z');
            const meta = ' w:author="' + xmlEscape(EXPORT_AUTHOR) + '" w:date="' + stamp + '"';
            let body = '';

            lines.forEach((line) => {
                let pPr = '';
                if (line.paraMark === 'ins') {
                    // 段落標記係新增：Word 入面 accept 就保留分段，reject 就合併返
                    pPr = '<w:pPr><w:rPr><w:ins w:id="' + (id++) + '"' + meta + '/></w:rPr></w:pPr>';
                } else if (line.paraMark === 'del') {
                    // 段落標記被刪除：Word 入面 accept 就同下一段合併
                    pPr = '<w:pPr><w:rPr><w:del w:id="' + (id++) + '"' + meta + '/></w:rPr></w:pPr>';
                }

                let inner = '';
                line.segs.forEach((seg) => {
                    if (!seg.text) return;
                    if (seg.type === 'ins') {
                        inner += '<w:ins w:id="' + (id++) + '"' + meta + '>' + docxRun(seg.text, 'ins') + '</w:ins>';
                    } else if (seg.type === 'del') {
                        inner += '<w:del w:id="' + (id++) + '"' + meta + '>' + docxRun(seg.text, 'del') + '</w:del>';
                    } else {
                        inner += docxRun(seg.text, 'eq');
                    }
                });

                body += '<w:p>' + pPr + inner + '</w:p>';
            });

            return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
                '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
                '<w:body>' + body +
                '<w:sectPr><w:pgSz w:w="11906" w:h="16838"/>' +
                '<w:pgMar w:top="1134" w:right="1134" w:bottom="1134" w:left="1134" w:header="720" w:footer="720" w:gutter="0"/>' +
                '</w:sectPr></w:body></w:document>';
        }

        function exportAsDocx() {
            if (!isResultReady()) return;
            if (typeof JSZip === 'undefined') {
                alert('載入唔到 JSZip（產生 .docx 需要用到），請檢查網絡連線再試一次。');
                return;
            }

            const contentTypes = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
                '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">' +
                '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>' +
                '<Default Extension="xml" ContentType="application/xml"/>' +
                '<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>' +
                '<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>' +
                '</Types>';

            const rootRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
                '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
                '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>' +
                '</Relationships>';

            const docRels = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
                '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">' +
                '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>' +
                '</Relationships>';

            const styles = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>\n' +
                '<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">' +
                '<w:docDefaults><w:rPrDefault><w:rPr>' +
                '<w:rFonts w:ascii="Calibri" w:hAnsi="Calibri" w:eastAsia="PMingLiU" w:cs="Times New Roman"/>' +
                '<w:sz w:val="24"/><w:szCs w:val="24"/><w:lang w:val="en-US" w:eastAsia="zh-HK"/>' +
                '</w:rPr></w:rPrDefault>' +
                '<w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="276" w:lineRule="auto"/></w:pPr></w:pPrDefault>' +
                '</w:docDefaults>' +
                '<w:style w:type="paragraph" w:default="1" w:styleId="Normal"><w:name w:val="Normal"/><w:qFormat/></w:style>' +
                '</w:styles>';

            try {
                const zip = new JSZip();
                zip.file('[Content_Types].xml', contentTypes);
                zip.folder('_rels').file('.rels', rootRels);
                const word = zip.folder('word');
                word.file('document.xml', buildDocumentXml(collectDiffLines()));
                word.file('styles.xml', styles);
                word.folder('_rels').file('document.xml.rels', docRels);

                zip.generateAsync({
                    type: 'blob',
                    compression: 'DEFLATE',
                    mimeType: 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'
                }).then((blob) => {
                    downloadBlob(blob, '對比結果_' + exportTimestamp() + '.docx');
                }).catch((err) => {
                    console.error(err);
                    alert('產生 .docx 時發生錯誤，請再試一次。');
                });
            } catch (err) {
                console.error(err);
                alert('產生 .docx 時發生錯誤，請再試一次。');
            }
        }

        /* ===== 跳轉功能（keyboard + swipe） ===== */
        function getChangeList() {
            // 每次都重新查詢，因為 accept 咗嘅 change 會消失
            // 跨行嘅 change fragments 會 group 埋一齊當一個 change
            const spans = document.querySelectorAll('#boxC .diff-added, #boxC .diff-removed');
            const groups = [];
            const seenCids = new Set();
            spans.forEach((sp) => {
                const c = sp.getAttribute('data-cid');
                if (!seenCids.has(c)) {
                    seenCids.add(c);
                    groups.push({ cid: c, first: sp });
                }
            });
            return groups;
        }

        function jumpToChange(direction) {
            const changes = getChangeList();
            if (changes.length === 0) return;

            if (direction === 'next') {
                currentChangeIndex++;
                if (currentChangeIndex >= changes.length) {
                    currentChangeIndex = 0; // 到咗最尾就返去第一個
                }
            } else {
                currentChangeIndex--;
                if (currentChangeIndex < 0) {
                    currentChangeIndex = changes.length - 1; // 喺第一個再向前就跳去最尾
                }
            }

            // 移除所有舊高亮，將目前 change group 嘅所有 fragments 一齊高亮
            document.querySelectorAll('#boxC .diff-current').forEach(el => el.classList.remove('diff-current'));
            const target = changes[currentChangeIndex];
            document.querySelectorAll(`#boxC [data-cid="${target.cid}"]`).forEach(el => el.classList.add('diff-current'));

            // 畫面直接跳去嗰個 change 嘅位置（置中顯示）
            target.first.scrollIntoView({ behavior: 'smooth', block: 'center' });

            updateNavStatus();
        }

        function updateNavStatus() {
            const navStatus = document.getElementById('navStatus');
            const navStatusText = document.getElementById('navStatusText');
            const changes = getChangeList();
            const boxCVisible = document.getElementById('boxC').style.display === 'block';

            if (!boxCVisible) {
                navStatus.style.display = 'none';
                return;
            }

            navStatus.style.display = 'block';
            if (changes.length === 0) {
                navStatusText.textContent = '✔ 冇（剩餘嘅）changes';
                return;
            }
            if (currentChangeIndex >= 0 && currentChangeIndex < changes.length) {
                navStatusText.textContent = 'Change ' + (currentChangeIndex + 1) + ' / ' + changes.length;
            } else {
                navStatusText.textContent = '共 ' + changes.length + ' 個 changes（撳 ← / → 或 swipe 跳轉）';
            }
        }

        // ---- Keyboard：左右鍵 ----
        document.addEventListener('keydown', function(e) {
            // 如果正喺 textarea 或 input 度打字，唔好搶走左右鍵
            const tag = document.activeElement.tagName;
            if (tag === 'TEXTAREA' || tag === 'INPUT') return;

            // 未撳過比較就唔理
            if (document.getElementById('boxC').style.display !== 'block') return;

            if (e.key === 'ArrowRight') {
                e.preventDefault();
                jumpToChange('next');
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                jumpToChange('prev');
            }
        });

        // ---- 手機：左右 swipe ----
        let touchStartX = 0;
        let touchStartY = 0;

        document.addEventListener('touchstart', function(e) {
            touchStartX = e.changedTouches[0].clientX;
            touchStartY = e.changedTouches[0].clientY;
        }, { passive: true });

        document.addEventListener('touchend', function(e) {
            // 未撳過比較就唔理
            if (document.getElementById('boxC').style.display !== 'block') return;

            // 喺 textarea 上面 swipe 就唔理（可能係想 scroll 或者揀字）
            if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;

            const dx = e.changedTouches[0].clientX - touchStartX;
            const dy = e.changedTouches[0].clientY - touchStartY;

            // 橫向移動要夠 50px，而且橫向幅度要大過縱向（避免同上下 scroll 撞）
            if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) {
                if (dx > 0) {
                    // swipe 向右 → 下一個 change
                    jumpToChange('next');
                } else {
                    // swipe 向左 → 上一個 change
                    jumpToChange('prev');
                }
            }
        }, { passive: true });
    </script>
</body>
</html>
